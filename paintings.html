<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paintings - Photo Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Merriweather', Georgia, serif; padding: 1rem; }
        .back-link { margin-bottom: 1rem; display: inline-block; text-decoration: none; color: #0066cc; }
        .gallery { display: flex; flex-wrap: wrap; }
        .gallery img { margin: 5px; width: auto; max-height: 300px; }

</head>
<body>
    <a href="index.html" class="back-link">&larr; Back to Home</a>
    <h1>Paintings</h1>
    <div class="gallery-item" onclick="openSlideshow(0)">
        <img src="paintings/thumbs/der_sbahnzug.jpg" data-full="paintings/full/der_sbahnzug.jpg" alt="Der S-Bahn Zug">
        <div class="item-title">Der S-Bahn Zug</div>
    </div>
    <div class="gallery-item" onclick="openSlideshow(1)">
        <img src="paintings/thumbs/after_the_burial.jpg" data-full="paintings/full/after_the_burial.jpg" alt="After the Burial">
        <div class="item-title">After the Burial</div>
    </div>

</html>
