<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prints — Gallery Wall</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Playfair Display', Georgia, serif;
            background-color: #121214;
            color: #f0f0f2;
            padding: 2rem 1.5rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            border-bottom: 1px solid #27272a;
            padding-bottom: 1rem;
        }

        .back-link {
            text-decoration: none;
            color: #a1a1aa;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .back-link:hover { color: #ffffff; }

        h1 {
            font-weight: 300;
            letter-spacing: 0.05em;
        }

        .gallery-wall {
            column-count: 3;
            column-gap: 1.5rem;
        }

        @media (max-width: 900px) { .gallery-wall { column-count: 2; } }
        @media (max-width: 550px) { .gallery-wall { column-count: 1; } }

        .gallery-item {
            break-inside: avoid;
            margin-bottom: 1.5rem;
            position: relative;
            cursor: pointer;
            border-radius: 4px;
            overflow: hidden;
            background: #18181b;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .gallery-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        .gallery-item .item-title {
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            color: #a1a1aa;
            text-align: center;
            background: #18181b;
        }

        .work-year {
            display: block;
        }

        .slideshow-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.92);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .slideshow-modal.active {
            display: flex;
        }

        .slideshow-content {
            position: relative;
            max-width: 85vw;
            max-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slideshow-image {
            max-width: 85vw;
            max-height: 80vh;
            object-fit: contain;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        .caption {
            margin-top: 1.25rem;
            color: #d4d4d8;
            font-size: 0.95rem;
            letter-spacing: 0.03em;
            text-align: center;
            white-space: pre-line;
        }

        .metadata {
            position: absolute;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            width: max-content;
            max-width: 90%;
            margin: 0;
            padding: 0.5rem 0.75rem;
            background: rgba(0, 0, 0, 0.7);
            color: #a1a1aa;
            font-size: 0.8rem;
            text-align: center;
            white-space: pre-line;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .slideshow-image:hover + .metadata {
            opacity: 1;
        }

        .modal-btn {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: none;
            font-size: 1.75rem;
            padding: 0.75rem 1.25rem;
            cursor: pointer;
            border-radius: 4px;
            user-select: none;
            transition: background 0.2s;
        }

        .modal-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .close-btn {
            top: 20px;
            right: 25px;
            font-size: 2rem;
            background: none;
            padding: 0.25rem 0.75rem;
        }
        .close-btn:hover { background: none; color: #ef4444; }

        .prev-btn { left: 20px; top: 50%; transform: translateY(-50%); }
        .next-btn { right: 20px; top: 50%; transform: translateY(-50%); }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-link">&larr; Home</a>
        <h1>Printmkaing</h1>
        <div style="width: 100px;"></div>
    </header>

    <div class="gallery-wall">
        <div class="gallery-item" onclick="openSlideshow(0)">
            <img src="prints/thumbs/at_a_loss_2026.jpg" data-full="prints/full/at_a_loss_2026.jpg" alt="At a Loss">
            <div class="item-title">At a Loss<span class="work-year">2026</span></div>
        </div>
        <div class="gallery-item" onclick="openSlideshow(1)">
            <img src="prints/thumbs/paar_2026.jpg" data-full="prints/full/paar_2026.jpg" alt="Paar">
            <div class="item-title">Paar<span class="work-year">2026</span></div>
        </div>
        <div class="gallery-item" onclick="openSlideshow(2)">
            <img src="prints/thumbs/refusal_2026.jpg" data-full="prints/full/refusal_2026.jpg" alt="Refusal">
            <div class="item-title">Refusal<span class="work-year">2026</span></div>
        </div>
        <div class="gallery-item" onclick="openSlideshow(3)">
            <img src="prints/thumbs/striving_2026.jpg" data-full="prints/full/striving_2026.jpg" alt="Striving">
            <div class="item-title">Striving<span class="work-year">2026</span></div>
        </div>
        <div class="gallery-item" onclick="openSlideshow(4)">
            <img src="prints/thumbs/the_conversation_2026.jpg" data-full="prints/full/the_conversation_2026.jpg" alt="The Conversation">
            <div class="item-title">The Conversation<span class="work-year">2026</span></div>
        </div>
        <div class="gallery-item" onclick="openSlideshow(5)">
            <img src="prints/thumbs/the_knights_2026.jpg" data-full="prints/full/the_knights_2026.jpg" alt="The Knights">
            <div class="item-title">The Knights<span class="work-year">2026</span></div>
        </div>
    </div>

    <div id="slideshowModal" class="slideshow-modal" onclick="closeOnOuterClick(event)">
        <button class="modal-btn close-btn" onclick="closeSlideshow()">&times;</button>
        <button class="modal-btn prev-btn" onclick="changeSlide(-1)">&#10094;</button>

        <div class="slideshow-content">
            <img id="slideshowImg" class="slideshow-image" src="" alt="">
            <div id="slideshowMetadata" class="metadata"></div>
        </div>
        <div id="slideshowCaption" class="caption"></div>

        <button class="modal-btn next-btn" onclick="changeSlide(1)">&#10095;</button>
    </div>

    <script src="metadata.js"></script>
    <script>
        const galleryItems = document.querySelectorAll('.gallery-item');
        const images = Array.from(galleryItems).map(item => {
            const img = item.querySelector('img');
            return {
                full: img.dataset.full || img.src,
                title: img.alt
            };
        });

        let currentIndex = 0;
        let artworkMetadata = new Map();

        loadArtworkMetadata().then(metadata => {
            artworkMetadata = metadata;
            updateSlideshow();
        }).catch(error => console.error(error));

        function openSlideshow(index) {
            currentIndex = index;
            updateSlideshow();
            document.getElementById('slideshowModal').classList.add('active');
            document.addEventListener('keydown', handleKeyPress);
        }

        function closeSlideshow() {
            document.getElementById('slideshowModal').classList.remove('active');
            document.removeEventListener('keydown', handleKeyPress);
        }

        function changeSlide(direction) {
            currentIndex += direction;
            if (currentIndex < 0) {
                currentIndex = images.length - 1;
            } else if (currentIndex >= images.length) {
                currentIndex = 0;
            }
            updateSlideshow();
        }

        function updateSlideshow() {
            const slideshowImg = document.getElementById('slideshowImg');
            const slideshowCaption = document.getElementById('slideshowCaption');
            const slideshowMetadata = document.getElementById('slideshowMetadata');
            const metadata = metadataForImage(artworkMetadata, images[currentIndex].full);

            slideshowImg.src = images[currentIndex].full;
            slideshowImg.alt = images[currentIndex].title;
            slideshowCaption.textContent = `${metadata.name}${metadata.date !== "Unknown" ? `\n${metadata.date}` : ""}`;
            slideshowMetadata.textContent = `${metadata.dimensions}\n${metadata.technique}`;
        }

        function closeOnOuterClick(event) {
            if (event.target.id === 'slideshowModal') {
                closeSlideshow();
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Escape') {
                closeSlideshow();
            } else if (event.key === 'ArrowRight') {
                changeSlide(1);
            } else if (event.key === 'ArrowLeft') {
                changeSlide(-1);
            }
        }
    </script>
</body>
</html>
