<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light-Maka Art</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: "Playfair Display", Georgia, serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .page-layout { display: flex; justify-content: space-between; align-items: flex-start; gap: 3rem; padding-bottom: 1rem; border-bottom: 1px solid #ccc; }
        h1 { font-size: 2em; }
        .contact-info { margin-bottom: 0; }
        .contact-info a { color: inherit; text-decoration: none; font-style: italic; font-weight: normal; }
        .nav-links { display: flex; flex-direction: column; gap: 0.75rem; list-style: none; margin: 0; padding: 0; }
        .nav-links a { color: inherit; text-decoration: none; font-style: italic; font-weight: normal; }
        nav { flex: 0 0 180px; padding-top: 1.34em; text-align: right; }
        .artwork-showcase { display: flex; justify-content: center; margin: 2rem auto 0; }
        .artwork-slideshow { position: relative; width: min(100%, 700px); height: min(65vh, 600px); }
        .artwork-slideshow img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity 1s ease-in-out; }
        .artwork-slideshow img.is-visible { opacity: 1; }
        @media (max-width: 600px) { .page-layout { flex-direction: column; gap: 1rem; } nav { flex-basis: auto; padding-top: 0; } }
    </style>
</head>
<body>
    <main class="page-layout">
        <div>
            <h1>Ian Light-Maka</h1>
            <p>Berlin, Wellfleet</p>

            <!-- Contact Information -->
            <section class="contact-info">
                <p><a href="contact.html" target="_blank" rel="noopener noreferrer">Contact</a></p>
                <p><a href="https://instagram.com/light.maka.art" target="_blank">@light.maka.art</a></p>
            </section>
        </div>

        <!-- Navigation Links to Sub-pages -->
        <nav>
            <ul class="nav-links">
                <li><a href="artist_statement.html">About</a></li>
                <li><a href="drawings.html">Drawing</a></li>
                <li><a href="paintings.html">Painting</a></li>
                <li><a href="prints.html">Printmaking</a></li>
            </ul>
        </nav>
    </main>

    <section class="artwork-showcase" aria-label="Selected artwork">
        <div class="artwork-slideshow"></div>
    </section>

    <script>
        const artworkFiles = [
            ["paintings/thumbs/cherub_2026.jpg", "Painting: Cherub"],
            ["drawings/thumbs/fire1.jpg", "Drawing: Fire 1"],
            ["paintings/thumbs/apprehension_2026.jpg", "Painting: Apprehension"],
            ["drawings/thumbs/armut_after_kollwitz.jpg", "Drawing: Armut after Kollwitz"],
            ["drawings/thumbs/august_7_20_minutes_2026.jpg", "Drawing: August 7, 20 minutes, 2026"],
            ["drawings/thumbs/fire2.jpg", "Drawing: Fire 2"],
            ["drawings/thumbs/fire3.jpg", "Drawing: Fire 3"],
            ["drawings/thumbs/january_5_minutes_2026.jpg", "Drawing: January, 5 Minutes"],
            ["drawings/thumbs/embrace.jpg", "Drawing: Embrace"],
            ["drawings/thumbs/wellfleet_railroad_pilings_2026.jpg", "Drawing: Wellfleet railroad pilings, 2026"],
            ["drawings/thumbs/riders_in_motion_1_2025.jpg", "Drawing: Riders in Motion I"],
            ["drawings/thumbs/riders_in_motion_2_2025.jpg", "Drawing: Riders in Motion II"],
            ["drawings/thumbs/riders_in_motion_3_2025.jpg", "Drawing: Riders in Motion III"],
            ["drawings/thumbs/the_drunkard_2025.jpg", "Drawing: The Drunkard"],
            ["paintings/thumbs/after_the_burial.jpg", "Painting: After the Burial"],
            ["paintings/thumbs/der_sbahnzug.jpg", "Painting: Der S-Bahnzug"],
            ["paintings/thumbs/alarm_2026.jpg", "Painting: Alarm"],
            ["prints/thumbs/at_a_loss_2026.jpg", "Print: At a Loss, 2026"],
            ["prints/thumbs/paar_2026.jpg", "Print: Paar, 2026"],
            ["prints/thumbs/refusal_2026.jpg", "Print: Refusal, 2026"],
            ["prints/thumbs/striving_2026.jpg", "Print: Striving, 2026"],
            ["prints/thumbs/the_conversation_2026.jpg", "Print: The Conversation, 2026"],
            ["prints/thumbs/the_knights_2026.jpg", "Print: The Knights, 2026"]
        ];
        const slideshow = document.querySelector(".artwork-slideshow");

        artworkFiles.forEach(([src, alt], index) => {
            const image = document.createElement("img");
            image.src = src;
            image.alt = alt;
            image.className = index === 0 ? "is-visible" : "";
            slideshow.appendChild(image);
        });

        const images = slideshow.querySelectorAll("img");
        let currentImage = 0;

        setInterval(() => {
            images[currentImage].classList.remove("is-visible");
            currentImage = (currentImage + 1) % images.length;
            images[currentImage].classList.add("is-visible");
        }, 7000);
    </script>
</body>
</html>
