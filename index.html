<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: "Playfair Display", Georgia, serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .page-layout { display: flex; justify-content: space-between; align-items: flex-start; gap: 3rem; padding-bottom: 1rem; border-bottom: 1px solid #ccc; }
        h1 { font-size: 2em; }
        .contact-info { margin-bottom: 0; }
        .nav-links { display: flex; flex-direction: column; gap: 0.75rem; list-style: none; margin: 0; padding: 0; }
        .nav-links a { color: inherit; text-decoration: none; font-style: italic; font-weight: normal; }
        nav { flex: 0 0 180px; padding-top: 1.34em; text-align: right; }
        .artwork-showcase { display: flex; justify-content: center; margin: 2rem auto 0; }
        .artwork-slideshow { position: relative; width: min(100%, 700px); height: min(65vh, 600px); }
        .artwork-slideshow img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity 1s ease-in-out; }
        .artwork-slideshow img.is-visible { opacity: 1; }
        @media (max-width: 600px) { .page-layout { flex-direction: column; gap: 1rem; } nav { flex-basis: auto; padding-top: 0; } }
    </style>
</head>
<body>
    <main class="page-layout">
        <div>
            <h1>Ian Light-Maka</h1>
            <p>Berlin, Wellfleet</p>

            <!-- Contact Information -->
            <section class="contact-info">
                <h2>Contact</h2>
                <form action="https://api.web3forms.com/submit" method="POST">
                    <input type="hidden" name="access_key" value="6701bef3-bb84-4c04-9369-693c3551a00b">
                    <p>
                        <label for="name">Name</label><br>
                        <input type="text" id="name" name="name" required>
                    </p>
                    <p>
                        <label for="email">Email</label><br>
                        <input type="email" id="email" name="email" required>
                    </p>
                    <p>
                        <label for="message">Message</label><br>
                        <textarea id="message" name="message" required></textarea>
                    </p>
                    <p>
                        GDPR Agreement: <input type="checkbox" name="gdpr" value="true" required> I consent to having this website store my submitted information so they can respond to my inquiry.
                    </p>
                    <button type="submit">Submit Form</button>
                </form>
                <p>Instagram: <a href="https://instagram.com/light.maka.art" target="_blank">@light.maka.art</a></p>
            </section>
        </div>

        <!-- Navigation Links to Sub-pages -->
        <nav>
            <ul class="nav-links">
                <li><a href="artist_statement.html">About</a></li>
                <li><a href="drawings.html">Drawings</a></li>
                <li><a href="paintings.html">Paintings</a></li>
                <li><a href="prints.html">Prints</a></li>
            </ul>
        </nav>
    </main>

    <section class="artwork-showcase" aria-label="Selected artwork">
        <div class="artwork-slideshow"></div>
    </section>

    <script>
        const artworkFiles = [
            ["ink_drawings/full/armut_after_kollwitz.jpg", "Drawing: Armut after Kollwitz"],
            ["ink_drawings/full/august_7_20_minutes_2026.jpg", "Drawing: August 7, 20 minutes, 2026"],
            ["ink_drawings/full/fire1.jpg", "Drawing: Fire 1"],
            ["ink_drawings/full/fire2.jpg", "Drawing: Fire 2"],
            ["ink_drawings/full/fire3.jpg", "Drawing: Fire 3"],
            ["ink_drawings/full/P8090996.jpg", "Drawing: P8090996"],
            ["ink_drawings/full/embrace.jpg", "Drawing: Embrace"],
            ["ink_drawings/full/wellfleet_railroad_pilings_2026.jpg", "Drawing: Wellfleet railroad pilings, 2026"],
            ["paintings/full/after_the_burial.jpg", "Painting: After the Burial"],
            ["paintings/full/der_sbahnzug.jpg", "Painting: Der S-Bahnzug"],
            ["prints/full/paar_less_contrast.jpg", "Print: Paar Less Contrast"]
        ];
        const slideshow = document.querySelector(".artwork-slideshow");

        artworkFiles.forEach(([src, alt], index) => {
            const image = document.createElement("img");
            image.src = src;
            image.alt = alt;
            image.className = index === 0 ? "is-visible" : "";
            slideshow.appendChild(image);
        });

        const images = slideshow.querySelectorAll("img");
        let currentImage = 0;

        setInterval(() => {
            images[currentImage].classList.remove("is-visible");
            currentImage = (currentImage + 1) % images.length;
            images[currentImage].classList.add("is-visible");
        }, 7000);
    </script>
</body>
</html>
